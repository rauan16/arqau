services:
  - type: web
    name: arqau-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./arqau.db
      - key: CORS_ORIGINS
        value: https://arqau.vercel.app,http://localhost:3000
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
