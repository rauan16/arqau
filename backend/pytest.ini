[pytest]
# Deterministic collection.
#
# testpaths makes a bare `pytest` from backend/ collect ONLY backend/tests/.
# This is what keeps the legacy backend/test_full.py out of the suite: it
# matches test_*.py, has no __main__ guard, and performs live HTTP against a
# running server plus writes real rows to arqau.db at import time.
testpaths = tests

# Stated explicitly (this is also pytest's default) so the test_full.py
# exclusion below reads as a deliberate decision rather than an accident.
python_files = test_*.py

markers =
    integration: tests that make a real OpenRouter API request (opt-in)

addopts = --strict-markers --ignore=test_full.py

# Central test-environment pinning (app.config, APP_ENV/SECRET_KEY/
# OPENAI_API_KEY) is intentionally NOT done here; it is Phase 3.5.5 work.
